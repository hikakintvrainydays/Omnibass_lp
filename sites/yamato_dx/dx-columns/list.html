<head>

    <style>
        .column-list-page {
            max-width: 1180px;
            margin: 0 auto;
            padding: 64px 24px 96px;
        }
        .column-list-hero {
            text-align: center;
            margin-bottom: 56px;
        }
        .column-list-hero__eyebrow {
            font-size: 11px;
            letter-spacing: 0.18em;
            color: var(--primary-deep);
            margin: 0 0 12px;
            text-transform: uppercase;
            font-weight: 800;
        }
        .column-list-hero h1 {
            font-size: clamp(32px, 5vw, 48px);
            margin: 0 0 16px;
            line-height: 1.3;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: var(--text);
        }
        .column-list-hero p.lead {
            color: var(--muted);
            margin: 0 auto;
            max-width: 640px;
            line-height: 1.85;
            font-size: 15px;
        }
        .column-list-meta {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.04em;
        }
        .column-list-meta__count {
            font-weight: 700;
            color: var(--primary-deep);
            background: var(--primary-soft);
            padding: 3px 10px;
            border-radius: 999px;
        }
        .column-tag-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 48px;
        }
        .column-tag-filter button {
            padding: 8px 18px;
            font-size: 13px;
            border-radius: 999px;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text-soft);
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s;
        }
        .column-tag-filter button:hover {
            border-color: var(--primary);
            color: var(--primary-deep);
            background: var(--primary-soft);
        }
        .column-tag-filter button.is-active {
            background: var(--text);
            color: #fff;
            border-color: var(--text);
        }
        .column-list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 28px;
        }
        .column-card {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            box-shadow: var(--shadow-sm);
        }
        .column-card:hover {
            transform: translateY(-6px);
            border-color: var(--primary);
            box-shadow: var(--shadow-lg);
        }
        .column-card__thumb {
            aspect-ratio: 16 / 9;
            background: var(--bg-soft);
            overflow: hidden;
            position: relative;
        }
        .column-card__thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }
        .column-card:hover .column-card__thumb img {
            transform: scale(1.05);
        }
        .column-card__body {
            padding: 22px 24px 26px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }
        .column-card__meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--muted);
        }
        .column-card__date {
            font-weight: 500;
            letter-spacing: 0.03em;
        }
        .column-card__tag {
            background: var(--primary-soft);
            color: var(--primary-deep);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 10px;
            letter-spacing: 0.10em;
            font-weight: 700;
            text-transform: uppercase;
        }
        .column-card__title {
            font-size: 17px;
            font-weight: 800;
            line-height: 1.55;
            margin: 0;
            color: var(--text);
            letter-spacing: -0.005em;
        }
        .column-card__arrow {
            margin-top: auto;
            padding-top: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-deep);
            transition: gap 0.2s;
        }
        .column-card:hover .column-card__arrow {
            gap: 10px;
        }
        .column-list-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--muted);
        }
        .column-list-state .spinner {
            margin: 0 auto 14px;
            width: 36px;
            height: 36px;
            border: 3px solid var(--bg-soft);
            border-top-color: var(--primary-strong);
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
        }
        .column-list-pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 56px;
            flex-wrap: wrap;
        }
        .column-list-pagination button {
            min-width: 40px;
            padding: 9px 14px;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text-soft);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.2s;
        }
        .column-list-pagination button:hover:not([disabled]) {
            border-color: var(--primary);
            color: var(--primary-deep);
        }
        .column-list-pagination button[disabled] {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .column-list-pagination button.is-current {
            background: var(--text);
            color: #fff;
            border-color: var(--text);
        }
        .column-list-back {
            margin-top: 64px;
            text-align: center;
        }
        .column-list-back a {
            color: var(--muted);
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 999px;
            border: 1px solid var(--border-strong);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            font-weight: 600;
        }
        .column-list-back a:hover {
            color: var(--primary-deep);
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        @media (max-width: 768px) {
            .column-list-page { padding: 40px 20px 64px; }
            .column-list-grid { grid-template-columns: 1fr; gap: 20px; }
            .column-card__title { font-size: 16px; }
        }
    </style>
</head>

    <main class="column-list-page">
        <div class="column-list-hero">
            <p class="column-list-hero__eyebrow">DX Column</p>
            <h1 data-en="Insights for SME DX" data-ja="DXコラム">DXコラム</h1>
            <p class="lead"
               data-en="Practical DX columns for SMEs in Shiga and Kansai. Topics include process improvement, AI use, subsidies, compliance, and industry-specific guides."
               data-ja="中小企業の経営者・現場担当者向けに、DX入門・業務改善・AI活用・補助金・法令対応・業種別DXなどを実務視点で解説しています。">
                中小企業の経営者・現場担当者向けに、DX入門・業務改善・AI活用・補助金・法令対応・業種別DXなどを実務視点で解説しています。

    <script src="../assets/static/cms-config.js?v=wp1"></script>
    <script src="../assets/static/cms-client.js?v=wp1"></script>
    <script src="../assets/static/article-images.js"></script>
    <script>
        (function () {
            const PER_PAGE = 12;
            const root = document.getElementById('column-list-root');
            const tagFilterEl = document.getElementById('tag-filter');
            const paginationEl = document.getElementById('pagination');
            const countEl = document.getElementById('article-count');

            let allItems = [];
            let activeTag = '__all__';
            let currentPage = 1;

            function setLang(lang) {
                document.body.setAttribute('data-lang', lang);
                document.querySelectorAll('.lang-toggle button').forEach(b => {
                    b.classList.toggle('is-active', b.dataset.lang === lang);
                });
                document.querySelectorAll('[data-en],[data-ja]').forEach(el => {
                    if (lang === 'en' && el.dataset.en) el.textContent = el.dataset.en;
                    else if (el.dataset.ja) el.textContent = el.dataset.ja;
                });
                renderList();
                renderTags();
            }

            document.querySelectorAll('.lang-toggle button').forEach(b => {
                b.addEventListener('click', () => setLang(b.dataset.lang));
            });

            function getLang() {
                return document.body.getAttribute('data-lang') || 'ja';
            }

            function pickField(item, key, lang) {
                const enKey = key + 'En';
                if (lang === 'en') {
                    return (item[enKey] && String(item[enKey]).trim()) || item[key] || '';
                }
                return (item[key] && String(item[key]).trim()) || item[enKey] || '';
            }

            function getThumb(item) {
                if (item.thumbnail && item.thumbnail.url) return item.thumbnail.url;
                if (window.YamatoArticleImages && item.id) {
                    return window.YamatoArticleImages.getCardImageUrl(item.id);
                }
                return '';
            }

            function buildCard(item, lang) {
                const esc = window.YamatoCMS.escapeHtml;
                const title = pickField(item, 'title', lang);
                const tag = pickField(item, 'tag', lang) || (lang === 'en' ? 'DX Column' : 'DXコラム');
                const date = window.YamatoCMS.formatDateDot(item.publishedAt || item.createdAt);
                const href = item.id ? `?id=${encodeURIComponent(item.id)}` : '#';
                const thumb = getThumb(item);
                const thumbHtml = thumb
                    ? `<div class="column-card__thumb"><img src="${esc(thumb)}" alt="" loading="lazy"></div>`
                    : '';
                const readMore = lang === 'en' ? 'Read more' : '記事を読む';
                return `
                    <a class="column-card" href="${esc(href)}">
                        ${thumbHtml}
                        <div class="column-card__body">
                            <div class="column-card__meta">
                                <span class="column-card__date">${esc(date)}</span>
                                <span class="column-card__tag">${esc(tag)}</span>
                            </div>
                            <h2 class="column-card__title">${esc(title)}</h2>
                            <span class="column-card__arrow">${esc(readMore)} →</span>
                        </div>
                    </a>`;
            }

            function getFilteredItems() {
                if (activeTag === '__all__') return allItems;
                return allItems.filter(it => {
                    const tagJa = (it.tag || '').trim();
                    const tagEn = (it.tagEn || '').trim();
                    return tagJa === activeTag || tagEn === activeTag;
                });
            }

            function renderTags() {
                const lang = getLang();
                const tagSet = new Map();
                allItems.forEach(it => {
                    const t = pickField(it, 'tag', lang);
                    if (t && !tagSet.has(t)) tagSet.set(t, true);
                });
                const allLabel = lang === 'en' ? 'All' : 'すべて';
                const tags = ['__all__', ...tagSet.keys()];
                tagFilterEl.innerHTML = tags.map(t => {
                    const label = t === '__all__' ? allLabel : t;
                    const cls = t === activeTag ? 'is-active' : '';
                    return `<button type="button" class="${cls}" data-tag="${window.YamatoCMS.escapeHtml(t)}">${window.YamatoCMS.escapeHtml(label)}</button>`;
                }).join('');
                tagFilterEl.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        activeTag = btn.dataset.tag;
                        currentPage = 1;
                        renderTags();
                        renderList();
                    });
                });
            }

            function renderList() {
                const lang = getLang();
                const items = getFilteredItems();
                if (items.length === 0) {
                    const msg = lang === 'en' ? 'No articles yet.' : '記事はまだありません。';
                    root.innerHTML = `<div class="column-list-state"><p>${msg}</p></div>`;
                    paginationEl.hidden = true;
                    return;
                }
                const totalPages = Math.max(1, Math.ceil(items.length / PER_PAGE));
                if (currentPage > totalPages) currentPage = totalPages;
                const start = (currentPage - 1) * PER_PAGE;
                const slice = items.slice(start, start + PER_PAGE);
                root.innerHTML = `<div class="column-list-grid">${slice.map(it => buildCard(it, lang)).join('')}</div>`;
                renderPagination(totalPages);
            }

            function renderPagination(totalPages) {
                if (totalPages <= 1) {
                    paginationEl.hidden = true;
                    paginationEl.innerHTML = '';
                    return;
                }
                paginationEl.hidden = false;
                const lang = getLang();
                const prev = lang === 'en' ? '← Prev' : '← 前へ';
                const next = lang === 'en' ? 'Next →' : '次へ →';
                let html = `<button type="button" data-page="${currentPage - 1}" ${currentPage <= 1 ? 'disabled' : ''}>${prev}</button>`;
                for (let p = 1; p <= totalPages; p++) {
                    const cls = p === currentPage ? 'is-current' : '';
                    html += `<button type="button" class="${cls}" data-page="${p}">${p}</button>`;
                }
                html += `<button type="button" data-page="${currentPage + 1}" ${currentPage >= totalPages ? 'disabled' : ''}>${next}</button>`;
                paginationEl.innerHTML = html;
                paginationEl.querySelectorAll('button[data-page]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const p = parseInt(btn.dataset.page, 10);
                        if (!isNaN(p)) {
                            currentPage = p;
                            renderList();
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        }
                    });
                });
            }

            async function init() {
                if (!window.YamatoCMS || !window.YamatoCMS.isConfigured()) {
                    root.innerHTML = `<div class="column-list-state"><p>CMSの接続設定が完了していません。</p></div>`;
                    return;
                }
                const data = await window.YamatoCMS.fetchList('dx-columns', { limit: 100 });
                if (!data || !Array.isArray(data.contents)) {
                    root.innerHTML = `<div class="column-list-state"><p>記事の取得に失敗しました。</p></div>`;
                    return;
                }
                allItems = data.contents;
                if (countEl) countEl.textContent = String(allItems.length);
                renderTags();
                renderList();
            }

            init();
        })();
    </script>
