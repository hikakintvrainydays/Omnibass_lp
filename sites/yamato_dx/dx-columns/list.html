    <style>
        .column-list-page {
            max-width: 1180px;
            margin: 0 auto;
            padding: 64px 24px 96px;
        }
        .column-list-hero {
            text-align: center;
            margin-bottom: 56px;
        }
        .column-list-hero__eyebrow {
            font-size: 11px;
            letter-spacing: 0.18em;
            color: var(--primary-deep);
            margin: 0 0 12px;
            text-transform: uppercase;
            font-weight: 800;
        }
        .column-list-hero h1 {
            font-size: clamp(32px, 5vw, 48px);
            margin: 0 0 16px;
            line-height: 1.3;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: var(--text);
        }
        .column-list-hero p.lead {
            color: var(--muted);
            margin: 0 auto;
            max-width: 640px;
            line-height: 1.85;
            font-size: 15px;
        }
        .column-list-meta {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 20px;
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.04em;
        }
        .column-list-meta__count {
            font-weight: 700;
            color: var(--primary-deep);
            background: var(--primary-soft);
            padding: 3px 10px;
            border-radius: 999px;
        }
        .column-tag-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin-bottom: 48px;
        }
        .column-tag-filter button {
            padding: 8px 18px;
            font-size: 13px;
            border-radius: 999px;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text-soft);
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: all 0.2s;
        }
        .column-tag-filter button:hover {
            border-color: var(--primary);
            color: var(--primary-deep);
            background: var(--primary-soft);
        }
        .column-tag-filter button.is-active {
            background: var(--text);
            color: #fff;
            border-color: var(--text);
        }
        .column-list-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 28px;
        }
        .column-card {
            display: flex;
            flex-direction: column;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            box-shadow: var(--shadow-sm);
        }
        .column-card:hover {
            transform: translateY(-6px);
            border-color: var(--primary);
            box-shadow: var(--shadow-lg);
        }
        .column-card__thumb {
            aspect-ratio: 16 / 9;
            background: var(--bg-soft);
            overflow: hidden;
            position: relative;
        }
        .column-card__thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }
        .column-card:hover .column-card__thumb img {
            transform: scale(1.05);
        }
        .column-card__body {
            padding: 22px 24px 26px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex: 1;
        }
        .column-card__meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 12px;
            color: var(--muted);
        }
        .column-card__date {
            font-weight: 500;
            letter-spacing: 0.03em;
        }
        .column-card__tag {
            background: var(--primary-soft);
            color: var(--primary-deep);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 10px;
            letter-spacing: 0.10em;
            font-weight: 700;
            text-transform: uppercase;
        }
        .column-card__title {
            font-size: 17px;
            font-weight: 800;
            line-height: 1.55;
            margin: 0;
            color: var(--text);
            letter-spacing: -0.005em;
        }
        .column-card__arrow {
            margin-top: auto;
            padding-top: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            font-weight: 700;
            color: var(--primary-deep);
            transition: gap 0.2s;
        }
        .column-card:hover .column-card__arrow {
            gap: 10px;
        }
        .column-list-state {
            text-align: center;
            padding: 80px 20px;
            color: var(--muted);
        }
        .column-list-state .spinner {
            margin: 0 auto 14px;
            width: 36px;
            height: 36px;
            border: 3px solid var(--bg-soft);
            border-top-color: var(--primary-strong);
            border-radius: 50%;
            animation: spin 0.85s linear infinite;
        }
        .column-list-pagination {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 56px;
            flex-wrap: wrap;
        }
        .column-list-pagination button {
            min-width: 40px;
            padding: 9px 14px;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text-soft);
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            font-family: inherit;
            transition: all 0.2s;
        }
        .column-list-pagination button:hover:not([disabled]) {
            border-color: var(--primary);
            color: var(--primary-deep);
        }
        .column-list-pagination button[disabled] {
            opacity: 0.3;
            cursor: not-allowed;
        }
        .column-list-pagination button.is-current {
            background: var(--text);
            color: #fff;
            border-color: var(--text);
        }
        .column-list-back {
            margin-top: 64px;
            text-align: center;
        }
        .column-list-back a {
            color: var(--muted);
            font-size: 14px;
            padding: 10px 20px;
            border-radius: 999px;
            border: 1px solid var(--border-strong);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            font-weight: 600;
        }
        .column-list-back a:hover {
            color: var(--primary-deep);
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        @media (max-width: 768px) {
            .column-list-page { padding: 40px 20px 64px; }
            .column-list-grid { grid-template-columns: 1fr; gap: 20px; }
            .column-card__title { font-size: 16px; }
        }
    </style>
</head>

    <script src="../assets/static/cms-config.js?v=wp1"></script>
    <script src="../assets/static/cms-client.js?v=wp2"></script>
    <script src="../assets/static/article-images.js"></script>
    <script>
        (function () {
            const PER_PAGE = 12;
            const TAXONOMY_REST = 'dx-column-categories';
            const TAXONOMY_QUERY = 'dx-column-categories';
            const root = document.getElementById('column-list-root');
            const tagFilterEl = document.getElementById('tag-filter');
            const paginationEl = document.getElementById('pagination');
            const countEl = document.getElementById('article-count');

            // 全カテゴリの term 情報。{id, slug, name, count} の配列
            let allTerms = [];
            // 現在の絞り込み: null なら全件
            let activeTermId = null;
            let activeTermSlug = '__all__';
            // 現在の表示中ページ
            let currentPage = 1;
            // 現在のフィルタにおける総ページ数 / 総件数
            let totalCount = 0;
            let totalPages = 1;
            // 全件表示時の総数 (タグカウント未対応時のフォールバック表示用)
            let totalAllCount = 0;

            function setLang(lang) {
                document.body.setAttribute('data-lang', lang);
                document.querySelectorAll('.lang-toggle button').forEach(b => {
                    b.classList.toggle('is-active', b.dataset.lang === lang);
                });
                document.querySelectorAll('[data-en],[data-ja]').forEach(el => {
                    if (lang === 'en' && el.dataset.en) el.textContent = el.dataset.en;
                    else if (el.dataset.ja) el.textContent = el.dataset.ja;
                });
                renderTags();
                // 言語が変わってもサーバーから取得したデータ自体は同じ。再描画のみ。
                if (lastFetched) renderListFromCache();
            }

            document.querySelectorAll('.lang-toggle button').forEach(b => {
                b.addEventListener('click', () => setLang(b.dataset.lang));
            });

            function getLang() {
                return document.body.getAttribute('data-lang') || 'ja';
            }

            function pickField(item, key, lang) {
                const enKey = key + 'En';
                if (lang === 'en') {
                    return (item[enKey] && String(item[enKey]).trim()) || item[key] || '';
                }
                return (item[key] && String(item[key]).trim()) || item[enKey] || '';
            }

            function getThumb(item) {
                if (item.thumbnail && item.thumbnail.url) return item.thumbnail.url;
                if (window.YamatoArticleImages && item.id) {
                    return window.YamatoArticleImages.getCardImageUrl(item.id);
                }
                return '';
            }

            function buildCard(item, lang) {
                const esc = window.YamatoCMS.escapeHtml;
                const title = pickField(item, 'title', lang);
                const tag = pickField(item, 'tag', lang) || (lang === 'en' ? 'DX Column' : 'DXコラム');
                const date = window.YamatoCMS.formatDateDot(item.publishedAt || item.createdAt);
                const href = item.id ? `index.html?id=${encodeURIComponent(item.id)}` : '#';
                const thumb = getThumb(item);
                const thumbHtml = thumb
                    ? `<div class="column-card__thumb"><img src="${esc(thumb)}" alt="" loading="lazy"></div>`
                    : '';
                const readMore = lang === 'en' ? 'Read more' : '記事を読む';
                return `
                    <a class="column-card" href="${esc(href)}">
                        ${thumbHtml}
                        <div class="column-card__body">
                            <div class="column-card__meta">
                                <span class="column-card__date">${esc(date)}</span>
                                <span class="column-card__tag">${esc(tag)}</span>
                            </div>
                            <h2 class="column-card__title">${esc(title)}</h2>
                            <span class="column-card__arrow">${esc(readMore)} →</span>
                        </div>
                    </a>`;
            }

            function renderTags() {
                const lang = getLang();
                const allLabel = lang === 'en' ? 'All' : 'すべて';
                const items = [{ slug: '__all__', name: allLabel, id: null, count: totalAllCount }]
                    .concat(allTerms.map(t => ({ slug: t.slug, name: t.name, id: t.id, count: t.count })));
                tagFilterEl.innerHTML = items.map(it => {
                    const cls = it.slug === activeTermSlug ? 'is-active' : '';
                    const label = it.slug === '__all__' ? it.name : it.name;
                    return `<button type="button" class="${cls}" data-slug="${window.YamatoCMS.escapeHtml(it.slug)}" data-id="${it.id == null ? '' : it.id}">${window.YamatoCMS.escapeHtml(label)}</button>`;
                }).join('');
                tagFilterEl.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', () => {
                        activeTermSlug = btn.dataset.slug;
                        activeTermId = btn.dataset.id ? parseInt(btn.dataset.id, 10) : null;
                        currentPage = 1;
                        loadAndRender();
                    });
                });
            }

            // サーバー取得結果のキャッシュ (言語切替時の再描画用)
            let lastFetched = null;

            function renderListFromCache() {
                if (!lastFetched) return;
                const lang = getLang();
                const items = lastFetched.contents;
                if (!items || items.length === 0) {
                    const msg = lang === 'en' ? 'No articles yet.' : '記事はまだありません。';
                    root.innerHTML = `<div class="column-list-state"><p>${msg}</p></div>`;
                    paginationEl.hidden = true;
                    return;
                }
                root.innerHTML = `<div class="column-list-grid">${items.map(it => buildCard(it, lang)).join('')}</div>`;
                renderPagination();
            }

            function renderPagination() {
                if (totalPages <= 1) {
                    paginationEl.hidden = true;
                    paginationEl.innerHTML = '';
                    return;
                }
                paginationEl.hidden = false;
                const lang = getLang();
                const prev = lang === 'en' ? '← Prev' : '← 前へ';
                const next = lang === 'en' ? 'Next →' : '次へ →';
                // ページ番号は7個までに省略表示
                const pagesToShow = compactPageList(currentPage, totalPages, 7);
                let html = `<button type="button" data-page="${currentPage - 1}" ${currentPage <= 1 ? 'disabled' : ''}>${prev}</button>`;
                for (const p of pagesToShow) {
                    if (p === '...') {
                        html += `<button type="button" disabled>…</button>`;
                    } else {
                        const cls = p === currentPage ? 'is-current' : '';
                        html += `<button type="button" class="${cls}" data-page="${p}">${p}</button>`;
                    }
                }
                html += `<button type="button" data-page="${currentPage + 1}" ${currentPage >= totalPages ? 'disabled' : ''}>${next}</button>`;
                paginationEl.innerHTML = html;
                paginationEl.querySelectorAll('button[data-page]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const p = parseInt(btn.dataset.page, 10);
                        if (!isNaN(p) && p !== currentPage) {
                            currentPage = p;
                            loadAndRender();
                            window.scrollTo({ top: 0, behavior: 'smooth' });
                        }
                    });
                });
            }

            function compactPageList(current, total, max) {
                if (total <= max) {
                    const arr = [];
                    for (let i = 1; i <= total; i++) arr.push(i);
                    return arr;
                }
                const arr = new Set([1, total, current, current - 1, current + 1]);
                const sorted = Array.from(arr).filter(n => n >= 1 && n <= total).sort((a, b) => a - b);
                const result = [];
                for (let i = 0; i < sorted.length; i++) {
                    if (i > 0 && sorted[i] - sorted[i - 1] > 1) result.push('...');
                    result.push(sorted[i]);
                }
                return result;
            }

            async function loadAndRender() {
                root.innerHTML = `<div class="column-list-state"><div class="spinner"></div><p>読み込み中...</p></div>`;
                const params = { limit: PER_PAGE, page: currentPage };
                if (activeTermId) {
                    params.taxonomy = TAXONOMY_QUERY;
                    params.termId = activeTermId;
                }
                const data = await window.YamatoCMS.fetchList('dx-columns', params);
                if (!data || !Array.isArray(data.contents)) {
                    root.innerHTML = `
                        <div class="column-list-state">
                            <p>記事の取得に失敗しました。通信が不安定な可能性があります。</p>
                            <p><button type="button" id="retry-btn" style="margin-top:14px;padding:10px 22px;border:1px solid var(--border-strong);background:var(--text);color:#fff;border-radius:999px;font-weight:700;cursor:pointer;font-family:inherit;">再読み込み</button></p>
                        </div>`;
                    const retryBtn = document.getElementById('retry-btn');
                    if (retryBtn) retryBtn.addEventListener('click', loadAndRender);
                    return;
                }
                lastFetched = data;
                totalCount = data.totalCount || 0;
                totalPages = Math.max(1, data.totalPages || 1);
                if (activeTermSlug === '__all__') totalAllCount = totalCount;
                if (countEl) countEl.textContent = String(activeTermSlug === '__all__' ? totalAllCount : totalCount);
                renderListFromCache();
                renderTags(); // count反映のため再描画
            }

            async function init() {
                if (!window.YamatoCMS || !window.YamatoCMS.isConfigured()) {
                    root.innerHTML = `<div class="column-list-state"><p>CMSの接続設定が完了していません。</p></div>`;
                    return;
                }
                // タグ群を取得 (なければ空配列で続行 = 単純ページネーション動作)
                if (typeof window.YamatoCMS.fetchTerms === 'function') {
                    const terms = await window.YamatoCMS.fetchTerms(TAXONOMY_REST);
                    allTerms = (terms || []).filter(t => (t.count || 0) > 0);
                }
                renderTags();
                await loadAndRender();
            }

            init();
        })();
    </script>
</body>
